name: Allen 3.1 clean atlas audit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linting:
    runs-on: ubuntu-latest
    name: Check Linting
    steps:
    - uses: neuroinformatics-unit/actions/lint@34bedfdfd70c6010be02182c9ca37fae8a1fd99d
  manifest:
    name: Check Manifest
    runs-on: ubuntu-latest
    steps:
    - uses: neuroinformatics-unit/actions/check_manifest@34bedfdfd70c6010be02182c9ca37fae8a1fd99d
  test:
    needs:
    - linting
    - manifest
    name: Run package tests
    timeout-minutes: 120
    runs-on: ${{ matrix.os }}
    env:
      KERAS_BACKEND: torch
      CELLFINDER_TEST_DEVICE: cpu
      BRAINGLOBE_TEST_DATA_DIR: ~/.pooch_cache
    strategy:
      matrix:
        os:
        - ubuntu-latest
        python-version:
        - '3.12'
        - '3.13'
        - '3.14'
        include:
        - os: macos-latest
          python-version: '3.14'
        - os: windows-latest
          python-version: '3.14'
    steps:
    - name: 'Audit: start with empty atlas storage'
      shell: python {0}
      run: "from pathlib import Path\nimport shutil\nfor name in (\".brainglobe\", \".brainglobe-tests\"):\n    root = Path.home() / name\n    if root.exists():\n        shutil.rmtree(root)\n    assert not root.exists(), root\n    print(f\"EMPTY_ATLAS_STORAGE {root}\", flush=True)\n"
    - name: Free Disk Space
      if: matrix.os == 'ubuntu-latest'
      uses: endersonmenezes/free-disk-space@6c4664f43348c8c7011b53488d5ca65e9fc5cd1a
      with:
        remove_android: true
        remove_dotnet: true
        rm_cmd: rmz
        rmz_version: 3.1.1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Cache pooch data
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
      with:
        path: ~/.pooch_cache
        key: ${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/pooch_registry.txt') }}
    - name: Run tests
      uses: neuroinformatics-unit/actions/test-uv@34bedfdfd70c6010be02182c9ca37fae8a1fd99d
      with:
        python-version: ${{ matrix.python-version }}
        secret-codecov-token: ${{ secrets.CODECOV_TOKEN }}
        install-extras: dev,napari
        use-headless: 'true'
    - name: 'Audit: verify downloaded Allen atlas is 3.1'
      if: always()
      shell: python {0}
      run: "from pathlib import Path\nimport json\nimport re\nfound = []\nfor name in (\".brainglobe\", \".brainglobe-tests\"):\n    for manifest in (Path.home() / name).rglob(\"manifest.json\"):\n        atlas_name = manifest.parent.parent.name\n        if re.fullmatch(r\"allen_mouse_\\d+um\", atlas_name):\n            record = {\"atlas\": atlas_name, \"version\": manifest.parent.name.replace(\"_\", \".\"), \"manifest\": str(manifest)}\n            print(\"ALLEN_ATLAS_AUDIT \" + json.dumps(record), flush=True)\n            found.append(record)\nassert all(item[\"version\"] == \"3.1\" for item in found), found\nif not found:\n    print(\"ALLEN_ATLAS_AUDIT no Allen manifest found; this job does not establish Allen coverage\", flush=True)\n"
  test_numba_disabled:
    needs:
    - linting
    - manifest
    name: Run tests with numba disabled
    timeout-minutes: 120
    runs-on: ubuntu-latest
    env:
      NUMBA_DISABLE_JIT: '1'
      PYTORCH_JIT: '0'
      BRAINGLOBE_TEST_DATA_DIR: ~/.pooch_cache
    steps:
    - name: 'Audit: start with empty atlas storage'
      shell: python {0}
      run: "from pathlib import Path\nimport shutil\nfor name in (\".brainglobe\", \".brainglobe-tests\"):\n    root = Path.home() / name\n    if root.exists():\n        shutil.rmtree(root)\n    assert not root.exists(), root\n    print(f\"EMPTY_ATLAS_STORAGE {root}\", flush=True)\n"
    - name: Free Disk Space
      uses: endersonmenezes/free-disk-space@6c4664f43348c8c7011b53488d5ca65e9fc5cd1a
      with:
        remove_android: true
        remove_dotnet: true
        rm_cmd: rmz
        rmz_version: 3.1.1
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Cache pooch data
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
      with:
        path: ~/.pooch_cache
        key: ${{ runner.os }}-3.14-${{ hashFiles('**/pooch_registry.txt') }}
    - name: Run tests with numba disabled
      uses: neuroinformatics-unit/actions/test-uv@34bedfdfd70c6010be02182c9ca37fae8a1fd99d
      with:
        python-version: '3.14'
        secret-codecov-token: ${{ secrets.CODECOV_TOKEN }}
        install-extras: dev,napari
        codecov-flags: numba
        use-headless: 'true'
    - name: 'Audit: verify downloaded Allen atlas is 3.1'
      if: always()
      shell: python {0}
      run: "from pathlib import Path\nimport json\nimport re\nfound = []\nfor name in (\".brainglobe\", \".brainglobe-tests\"):\n    for manifest in (Path.home() / name).rglob(\"manifest.json\"):\n        atlas_name = manifest.parent.parent.name\n        if re.fullmatch(r\"allen_mouse_\\d+um\", atlas_name):\n            record = {\"atlas\": atlas_name, \"version\": manifest.parent.name.replace(\"_\", \".\"), \"manifest\": str(manifest)}\n            print(\"ALLEN_ATLAS_AUDIT \" + json.dumps(record), flush=True)\n            found.append(record)\nassert all(item[\"version\"] == \"3.1\" for item in found), found\nif not found:\n    print(\"ALLEN_ATLAS_AUDIT no Allen manifest found; this job does not establish Allen coverage\", flush=True)\n"
  test_brainmapper_cli:
    needs:
    - linting
    - manifest
    name: Run brainmapper tests to check for breakages
    timeout-minutes: 120
    runs-on: ubuntu-latest
    env:
      KERAS_BACKEND: torch
      CELLFINDER_TEST_DEVICE: cpu
    steps:
    - name: 'Audit: start with empty atlas storage'
      shell: python {0}
      run: "from pathlib import Path\nimport shutil\nfor name in (\".brainglobe\", \".brainglobe-tests\"):\n    root = Path.home() / name\n    if root.exists():\n        shutil.rmtree(root)\n    assert not root.exists(), root\n    print(f\"EMPTY_ATLAS_STORAGE {root}\", flush=True)\n"
    - name: Free Disk Space
      uses: endersonmenezes/free-disk-space@6c4664f43348c8c7011b53488d5ca65e9fc5cd1a
      with:
        remove_android: true
        remove_dotnet: true
        rm_cmd: rmz
        rmz_version: 3.1.1
    - name: Checkout brainglobe-workflows
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: brainglobe/brainglobe-workflows
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      with:
        enable-cache: true
        python-version: '3.14'
        cache-dependency-glob: '**/pyproject.toml'
        activate-environment: true
    - name: Install cellfinder from this SHA and brainglobe-workflows
      shell: bash
      run: 'uv pip install "cellfinder @ git+$GITHUB_SERVER_URL/$GITHUB_REPOSITORY@$GITHUB_SHA"

        uv pip install ".[dev]"

        '
    - name: Run brainmapper tests
      shell: bash
      run: pytest --color=yes -v tests/brainmapper
    - name: 'Audit: verify downloaded Allen atlas is 3.1'
      if: always()
      shell: python {0}
      run: "from pathlib import Path\nimport json\nimport re\nfound = []\nfor name in (\".brainglobe\", \".brainglobe-tests\"):\n    for manifest in (Path.home() / name).rglob(\"manifest.json\"):\n        atlas_name = manifest.parent.parent.name\n        if re.fullmatch(r\"allen_mouse_\\d+um\", atlas_name):\n            record = {\"atlas\": atlas_name, \"version\": manifest.parent.name.replace(\"_\", \".\"), \"manifest\": str(manifest)}\n            print(\"ALLEN_ATLAS_AUDIT \" + json.dumps(record), flush=True)\n            found.append(record)\nassert all(item[\"version\"] == \"3.1\" for item in found), found\nif not found:\n    print(\"ALLEN_ATLAS_AUDIT no Allen manifest found; this job does not establish Allen coverage\", flush=True)\n"
'on':
  workflow_dispatch: null
